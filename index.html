    <title>pokedex</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    
</head>
<body>
    
    <div class="container">
            <h2>Busca de Pokémon</h2>
            <input type="text" id="campoBuscar"
            placeholder="Digite o nome do Pokémon...">
            <button id="btnBuscar">Pesquisar</button>
            <div id="resultado" class="escondido">
             <img id="PokeImg" src="" alt="imagem do pokemon">   
             <h3 id="pokeNome"></h3>
             <p><strong>ID:</strong> <span id="pokeID"></span></p>
               <p><strong>Altura:</strong> <span id="pokeID"></span></p>
                 <p><strong>Peso:</strong> <span id="pokeID"></span></p>
                   <p><strong>Tipo:</strong> <span id="pokeID"></span></p>
            </div>
            <div id="msgErro" class="escondido"></div>
            Pokemon não encontrado, tente novamente!
        </div>

</body>
